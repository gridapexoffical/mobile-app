<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridApex - Üdvözlünk</title>
    <style>
        :root {
            --bg-color: #06080e;
            --card-bg: #101420;
            --red-accent: #ff0055;
            --green-accent: #00ff66;
            --text-color: #ffffff;
            --subtext-color: #8b9bb4;
            --border-color: #1e2638;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--red-accent);
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .brand-title span {
            color: var(--red-accent);
        }

        .welcome-msg {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: block;
            transition: transform 0.1s, opacity 0.2s, border-color 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background: var(--red-accent);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .btn-register {
            background: transparent;
            color: var(--green-accent);
            border: 1px solid var(--green-accent);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .btn-register:hover {
            background: rgba(0, 255, 102, 0.1);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="brand-title">GRID<span>APEX</span></div>
        <div class="welcome-msg">Üdvözlünk!</div>
        <p class="subtitle">Kérjük, jelentkezz be vagy regisztrálj a folytatáshoz.</p>

        <div class="btn-group">
            <a href="login.html" class="btn btn-login">Bejelentkezés</a>
            <a href="register.html" class="btn btn-register">Regisztráció</a>
        </div>
    </div>

</body>
</html>
