<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridApex - Regisztráció</title>
    <style>
        :root {
            --bg-color: #06080e;
            --card-bg: #101420;
            --red-accent: #ff0055;
            --green-accent: #00ff66;
            --text-color: #ffffff;
            --subtext-color: #8b9bb4;
            --border-color: #1e2638;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--green-accent);
            border-radius: 12px;
            padding: 35px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-title span { color: var(--red-accent); }

        .subtitle {
            font-size: 0.85rem;
            color: var(--subtext-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--subtext-color);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #06080e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--green-accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-register {
            background: var(--green-accent);
            color: #000000;
        }

        .btn-google {
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .divider {
            text-align: center;
            color: var(--subtext-color);
            font-size: 0.75rem;
            margin: 18px 0;
            position: relative;
        }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 15px;
            text-align: center;
        }
        .status-error { color: var(--red-accent); }
        .status-success { color: var(--green-accent); }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--subtext-color);
            margin-top: 20px;
        }

        .footer-text a {
            color: var(--green-accent);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-title">GRID<span>APEX</span></div>
        <div class="subtitle">Fiók Létrehozása</div>

        <form id="register-form">
            <div class="form-group">
                <label>E-mail cím</label>
                <input type="email" id="email" required placeholder="pilota@gridapex.com">
            </div>

            <div class="form-group">
                <label>Jelszó</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-register">Regisztráció E-maillel</button>
        </form>

        <div class="divider">VAGY</div>

        <button type="button" id="btn-google" class="btn btn-google">
            Regisztráció Google-fiókkal
        </button>

        <div class="status-msg" id="status-msg"></div>

        <div class="footer-text">
            Már van fiókod? <a href="login.html">Bejelentkezés</a>
        </div>
    </div>

    <!-- Firebase SDK Modulok -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            sendEmailVerification,
            GoogleAuthProvider, 
            signInWithRedirect, 
            getRedirectResult 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX343Oi-c6JKJ0HVdhZihaNxtpiXdB5Sk",
            authDomain: "gridapexoffical.firebaseapp.com",
            projectId: "gridapexoffical",
            storageBucket: "gridapexoffical.firebasestorage.app",
            messagingSenderId: "932186345951",
            appId: "1:932186345951:web:e8d6d78ad6f275935bf46a",
            measurementId: "G-B318MBBYFM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const statusMsg = document.getElementById('status-msg');

        function showStatus(text, isError = false) {
            statusMsg.innerText = text;
            statusMsg.className = "status-msg " + (isError ? "status-error" : "status-success");
        }

        // WebView kompatibilis átirányítási eredmény feldolgozása
        getRedirectResult(auth)
            .then(async (result) => {
                if (result) {
                    const user = result.user;
                    showStatus("Google regisztráció sikeres!");
                    
                    // Alapértelmezett profil létrehozása Firestore-ban
                    await setDoc(doc(db, "users", user.uid), {
                        username: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        xp: 0,
                        rank: "Kezdő Pilóta",
                        createdAt: new Date().toISOString()
                    }, { merge: true });

                    window.location.href = "dashboard.html";
                }
            })
            .catch((error) => {
                showStatus("Google regisztrációs hiba: " + error.message, true);
            });

        // E-mailes Regisztráció
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                showStatus("Regisztráció folyamatban...");
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Ellenőrző e-mail küldése
                await sendEmailVerification(user);

                // Profil létrehozása Firestore-ban
                await setDoc(doc(db, "users", user.uid), {
                    username: email.split('@')[0],
                    email: email,
                    xp: 0,
                    rank: "Kezdő Pilóta",
                    createdAt: new Date().toISOString()
                });

                showStatus("Sikeres regisztráció! Ellenőrző e-mail elküldve.");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {
                showStatus("Hiba: " + error.message, true);
            }
        });

        // Google Regisztráció Átirányítással (Redirect)
        document.getElementById('btn-google').addEventListener('click', () => {
            showStatus("Átirányítás a Google-höz...");
            signInWithRedirect(auth, googleProvider);
        });
    </script>
</body>
</html>
