<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridApex - XP & Szintek</title>
    <style>
        :root {
            --bg-color: #06080e;
            --card-bg: #101420;
            --red-accent: #ff0055;
            --green-accent: #00ff66;
            --blue-accent: #00bfff;
            --text-color: #ffffff;
            --subtext-color: #8b9bb4;
            --border-color: #1e2638;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .brand-title span { color: var(--red-accent); }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-back:hover { border-color: var(--green-accent); color: var(--green-accent); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }

        /* XP Kiemelt Kártya */
        .xp-header-card {
            border-top: 3px solid var(--green-accent);
            text-align: center;
        }

        .level-badge {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--green-accent);
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            margin-bottom: 5px;
        }

        .xp-subtitle {
            font-size: 0.9rem;
            color: var(--subtext-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Progress Bar */
        .progress-container {
            background: #06080e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 24px;
            width: 100%;
            overflow: hidden;
            position: relative;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #00bfff, var(--green-accent));
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .xp-text-detail {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--subtext-color);
            font-weight: 700;
        }

        /* Mérföldkövek & Rangok */
        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--subtext-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .milestone-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .milestone-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #06080e;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .milestone-item.active {
            border-color: var(--green-accent);
            background: rgba(0, 255, 102, 0.05);
        }

        .milestone-info {
            display: flex;
            flex-direction: column;
        }

        .milestone-name {
            font-weight: 800;
            font-size: 0.95rem;
        }

        .milestone-req {
            font-size: 0.75rem;
            color: var(--subtext-color);
        }

        .milestone-status {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .status-unlocked {
            color: var(--green-accent);
            background: rgba(0, 255, 102, 0.15);
        }

        .status-locked {
            color: var(--subtext-color);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fejléc -->
        <div class="top-bar">
            <div class="brand-title">GRID<span>APEX</span> XP</div>
            <a href="dashboard.html" class="btn-back">← Vissza a Dashboardra</a>
        </div>

        <!-- Fő XP Állapot Kártya -->
        <div class="card xp-header-card">
            <div class="level-badge" id="user-level">LVL 1</div>
            <div class="xp-subtitle" id="user-rank-title">Kezdő Pilóta</div>

            <div class="progress-container">
                <div class="progress-bar" id="xp-progress"></div>
            </div>

            <div class="xp-text-detail">
                <span id="current-xp-display">0 XP</span>
                <span id="next-level-xp-display">100 XP a következő szintig</span>
            </div>
        </div>

        <!-- Szintek & Mérföldkövek -->
        <div class="card">
            <div class="card-title">Rangok & Mérföldkövek</div>
            <div class="milestone-list" id="milestones-container">
                <!-- Dinamikusan frissül JS-ből -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modulok -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX343Oi-c6JKJ0HVdhZihaNxtpiXdB5Sk",
            authDomain: "gridapexoffical.firebaseapp.com",
            projectId: "gridapexoffical",
            storageBucket: "gridapexoffical.firebasestorage.app",
            messagingSenderId: "932186345951",
            appId: "1:932186345951:web:e8d6d78ad6f275935bf46a",
            measurementId: "G-B318MBBYFM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Szintek & Mérföldkövek definíciója
        const ranks = [
            { level: 1, name: "Kezdő Pilóta", minXp: 0 },
            { level: 2, name: "Amatőr Versenyző", minXp: 100 },
            { level: 3, name: "Tapasztalt Pilóta", minXp: 300 },
            { level: 4, name: "Profi Versenyző", minXp: 600 },
            { level: 5, name: "Mester Pilóta", minXp: 1000 },
            { level: 6, name: "GridApex Legenda", minXp: 2000 }
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                let userXp = 0;

                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();
                    userXp = data.xp || 0; // Ha nincs még xp mezője, 0-nak veszi
                }

                updateXpUI(userXp);
            } else {
                window.location.href = "login.html";
            }
        });

        function updateXpUI(xp) {
            // Aktuális szint meghatározása
            let currentLevelObj = ranks[0];
            let nextLevelObj = ranks[1];

            for (let i = 0; i < ranks.length; i++) {
                if (xp >= ranks[i].minXp) {
                    currentLevelObj = ranks[i];
                    nextLevelObj = ranks[i + 1] || null;
                }
            }

            // UI elemek frissítése
            document.getElementById('user-level').innerText = `LVL ${currentLevelObj.level}`;
            document.getElementById('user-rank-title').innerText = currentLevelObj.name;
            document.getElementById('current-xp-display').innerText = `${xp} XP`;

            if (nextLevelObj) {
                const xpInCurrentLevel = xp - currentLevelObj.minXp;
                const xpNeededForNextLevel = nextLevelObj.minXp - currentLevelObj.minXp;
                const percentage = Math.min(100, Math.floor((xpInCurrentLevel / xpNeededForNextLevel) * 100));

                document.getElementById('xp-progress').style.width = `${percentage}%`;
                document.getElementById('next-level-xp-display').innerText = `${nextLevelObj.minXp - xp} XP kell a következő szintig`;
            } else {
                // Maximális szint elérése esetén
                document.getElementById('xp-progress').style.width = `100%`;
                document.getElementById('next-level-xp-display').innerText = `Max Szint Elérve!`;
            }

            // Mérföldkő lista kirajzolása
            const container = document.getElementById('milestones-container');
            container.innerHTML = "";

            ranks.forEach(r => {
                const isUnlocked = xp >= r.minXp;
                const item = document.createElement('div');
                item.className = `milestone-item ${isUnlocked ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="milestone-info">
                        <span class="milestone-name">LVL ${r.level} - ${r.name}</span>
                        <span class="milestone-req">${r.minXp} XP szükséges</span>
                    </div>
                    <span class="milestone-status ${isUnlocked ? 'status-unlocked' : 'status-locked'}">
                        ${isUnlocked ? 'Feloldva' : 'Zárolva'}
                    </span>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
  </html>
