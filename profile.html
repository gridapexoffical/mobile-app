<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridApex - Profil beállítások</title>
    <style>
        :root {
            --bg-color: #06080e;
            --card-bg: #101420;
            --red-accent: #ff0055;
            --green-accent: #00ff66;
            --blue-accent: #00bfff;
            --text-color: #ffffff;
            --subtext-color: #8b9bb4;
            --border-color: #1e2638;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .brand-title span { color: var(--red-accent); }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-back:hover { border-color: var(--green-accent); color: var(--green-accent); }

        .profile-header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--red-accent);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--red-accent);
            background: #000;
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--green-accent);
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 0 10px rgba(0,255,102,0.4);
        }

        #avatar-input { display: none; }

        .profile-details {
            flex: 1;
        }

        .user-name {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .user-tag {
            color: var(--subtext-color);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-rank { background: rgba(0, 191, 255, 0.15); color: var(--blue-accent); border: 1px solid var(--blue-accent); }
        .badge-team { background: rgba(0, 255, 102, 0.15); color: var(--green-accent); border: 1px solid var(--green-accent); }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .profile-header-card { flex-direction: column; text-align: center; }
            .badges { justify-content: center; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--subtext-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--subtext-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #06080e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus { border-color: var(--green-accent); }
        .form-control:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: var(--red-accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #161b29;
            font-size: 0.85rem;
        }

        .info-label { color: var(--subtext-color); }
        .info-value { font-weight: 600; text-align: right; }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 10px;
            text-align: center;
        }
        .status-error { color: var(--red-accent); }
        .status-success { color: var(--green-accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="brand-title">GRID<span>APEX</span></div>
            <a href="dashboard.html" class="btn-back">← Vissza a Dashboardra</a>
        </div>

        <div class="profile-header-card">
            <div class="avatar-container">
                <img id="profile-img" class="avatar-img" src="https://via.placeholder.com/150/101420/ffffff?text=GRID" alt="Profilkép">
                <label for="avatar-input" class="avatar-upload-btn" title="Profilkép feltöltése">+</label>
                <input type="file" id="avatar-input" accept="image/*">
            </div>
            <div class="profile-details">
                <div class="user-name" id="display-fullname">Betöltés...</div>
                <div class="user-tag" id="display-username">@loading</div>
                <div class="badges">
                    <span class="badge badge-rank" id="display-rank">Rang: Betöltés...</span>
                    <span class="badge badge-team" id="display-team">Csapat: Betöltés...</span>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">Profil Módosítása</div>
                
                <div class="form-group">
                    <label>Email Cím (Nem módosítható)</label>
                    <input type="email" id="email" class="form-control" disabled>
                </div>

                <div class="form-group">
                    <label>Teljes Név</label>
                    <input type="text" id="fullName" class="form-control">
                </div>

                <div class="form-group">
                    <label>Felhasználónév</label>
                    <input type="text" id="username" class="form-control">
                </div>

                <div class="form-group">
                    <label>Életkor</label>
                    <input type="number" id="age" class="form-control" min="10" max="99">
                </div>

                <div class="form-group">
                    <label>Csapat Neve</label>
                    <input type="text" id="team" class="form-control" placeholder="pl. Red Bull Racing">
                </div>

                <button class="btn-save" id="btn-save">Változtatások Mentése</button>
                <div class="status-msg" id="status-msg"></div>
            </div>

            <div class="card">
                <div class="card-title">Aktivitás & Munkamenet</div>

                <div class="info-row">
                    <span class="info-label">Azonosító (UID)</span>
                    <span class="info-value" id="info-uid" style="font-size: 0.7rem;">-</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Fiók Létrehozva</span>
                    <span class="info-value" id="info-created">-</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Utolsó Bejelentkezés</span>
                    <span class="info-value" id="info-last-login">-</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Észlelt Eszköz / Böngésző</span>
                    <span class="info-value" id="info-device">-</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Hitelesítési Mód</span>
                    <span class="info-value" id="info-provider">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modulok -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX343Oi-c6JKJ0HVdhZihaNxtpiXdB5Sk",
            authDomain: "gridapexoffical.firebaseapp.com",
            projectId: "gridapexoffical",
            storageBucket: "gridapexoffical.firebasestorage.app",
            messagingSenderId: "932186345951",
            appId: "1:932186345951:web:e8d6d78ad6f275935bf46a",
            measurementId: "G-B318MBBYFM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const statusMsg = document.getElementById('status-msg');

        function showStatus(text, isError = false) {
            statusMsg.innerText = text;
            statusMsg.className = "status-msg " + (isError ? "status-error" : "status-success");
        }

        function detectDevice() {
            const ua = navigator.userAgent;
            let device = "Ismeretlen eszköz";
            if (/android/i.test(ua)) device = "Android Mobil";
            else if (/iPhone|iPad|iPod/i.test(ua)) device = "iOS Eszköz";
            else if (/Windows/i.test(ua)) device = "Windows PC";
            else if (/Macintosh/i.test(ua)) device = "Mac PC";
            else if (/Linux/i.test(ua)) device = "Linux PC";

            let browser = "Böngésző";
            if (ua.includes("Chrome")) browser = "Chrome";
            else if (ua.includes("Firefox")) browser = "Firefox";
            else if (ua.includes("Safari")) browser = "Safari";
            else if (ua.includes("Edg")) browser = "Edge";

            return `${device} (${browser})`;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                document.getElementById('info-uid').innerText = user.uid;
                document.getElementById('info-created').innerText = new Date(user.metadata.creationTime).toLocaleString('hu-HU');
                document.getElementById('info-last-login').innerText = new Date(user.metadata.lastSignInTime).toLocaleString('hu-HU');
                document.getElementById('info-device').innerText = detectDevice();
                document.getElementById('info-provider').innerText = user.providerData[0]?.providerId === 'google.com' ? 'Google Fiók' : 'Email/Jelszó';

                // Firestore Adatok Kiolvasása (Rang és Csapat is)
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();

                    document.getElementById('email').value = user.email || '';
                    document.getElementById('fullName').value = data.fullName || '';
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('age').value = data.age || '';
                    document.getElementById('team').value = data.team || '';

                    // Firestore-ból olvasott adatok megjelenítése a jelvényeknél
                    const userRank = data.rank ? data.rank : 'Kezdő Pilóta';
                    const userTeam = data.team ? data.team : 'Nincs csapat';

                    document.getElementById('display-fullname').innerText = data.fullName || 'Ismeretlen Pilóta';
                    document.getElementById('display-username').innerText = '@' + (data.username || 'felhasznalo');
                    document.getElementById('display-rank').innerText = 'Rang: ' + userRank;
                    document.getElementById('display-team').innerText = 'Csapat: ' + userTeam;

                    if (data.photoURL) {
                        document.getElementById('profile-img').src = data.photoURL;
                    }
                }
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!currentUser) return;

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const age = document.getElementById('age').value.trim();
            const team = document.getElementById('team').value.trim();

            if (!fullName || !username) {
                showStatus("A név és felhasználónév kitöltése kötelező!", true);
                return;
            }

            try {
                showStatus("Mentés...");
                await setDoc(doc(db, "users", currentUser.uid), {
                    fullName: fullName,
                    username: username,
                    age: Number(age),
                    team: team || "Nincs csapat",
                    updatedAt: new Date().toISOString()
                }, { merge: true });

                // UI azonnali frissítése a mentett értékekkel
                document.getElementById('display-fullname').innerText = fullName;
                document.getElementById('display-username').innerText = '@' + username;
                document.getElementById('display-team').innerText = 'Csapat: ' + (team || 'Nincs csapat');

                showStatus("Sikeresen frissítve!");
            } catch (err) {
                showStatus("Hiba: " + err.message, true);
            }
        });

        document.getElementById('avatar-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 1024 * 1024 * 2) {
                showStatus("A kép mérete nem lehet nagyobb 2MB-nál!", true);
                return;
            }

            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64Image = event.target.result;
                document.getElementById('profile-img').src = base64Image;

                try {
                    showStatus("Profilkép frissítése...");
                    await setDoc(doc(db, "users", currentUser.uid), {
                        photoURL: base64Image
                    }, { merge: true });
                    showStatus("Profilkép sikeresen frissítve!");
                } catch (err) {
                    showStatus("Hiba a kép mentésekor: " + err.message, true);
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
